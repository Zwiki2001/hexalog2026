<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HexaLog — Benelux Network</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000814;font-family:'Space Grotesk',sans-serif}
canvas{position:fixed;inset:0;display:block}

#brand{position:fixed;top:28px;left:36px;display:flex;align-items:center;gap:12px;opacity:0;z-index:20}
.bh{width:46px;height:46px;background:linear-gradient(135deg,#1A3F8F,#2d5cc8);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:#fff;
  box-shadow:0 0 20px rgba(26,63,143,.8)}
.bn{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#E4EAFF,#F5A623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

#scene{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  text-align:center;z-index:20;opacity:0;pointer-events:none;width:90%;max-width:700px}
#stitle{font-size:clamp(1.5rem,4vw,3rem);font-weight:800;letter-spacing:-.03em;color:#E4EAFF;
  text-shadow:0 2px 40px rgba(0,0,0,.9);line-height:1.15}
#ssub{font-size:clamp(.8rem,1.8vw,1rem);color:#8094B8;margin-top:8px;font-weight:500;
  text-shadow:0 1px 20px rgba(0,0,0,.9)}

#dots{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:20;opacity:0}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);transition:.3s}
.dot.on{background:#F5A623;transform:scale(1.4)}

#stats{position:fixed;top:50%;right:32px;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;z-index:20;opacity:0}
.sc{background:rgba(7,13,26,.88);border:1px solid rgba(26,63,143,.45);
  border-radius:12px;padding:12px 18px;text-align:right;backdrop-filter:blur(10px)}
.sn{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#F5A623,#FFD166);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sl{font-size:.66rem;color:#8094B8;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}

#cta{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;opacity:0}
#cta a{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,#1A3F8F,#2d5cc8);
  color:#fff;text-decoration:none;border-radius:12px;padding:13px 28px;
  font-weight:700;font-size:.95rem;box-shadow:0 8px 28px rgba(26,63,143,.65);transition:.2s}
#cta a:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(26,63,143,.85)}

#replay{position:fixed;top:28px;right:36px;z-index:20;opacity:0;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#8094B8;border-radius:9px;padding:8px 16px;font-size:.8rem;font-weight:600;
  font-family:'Space Grotesk',sans-serif;transition:.2s}
#replay:hover{background:rgba(26,63,143,.4);color:#E4EAFF}

.clabel{position:fixed;pointer-events:none;z-index:20;display:none;
  opacity:0;transform:translate(-50%,-100%) translateY(-4px);transition:.4s}
.clabel.on{opacity:1;transform:translate(-50%,-100%) translateY(-12px)}
.cli{background:rgba(5,10,22,.92);border:1px solid rgba(245,166,35,.5);border-radius:8px;
  padding:4px 10px;font-size:.72rem;font-weight:700;color:#E4EAFF;
  white-space:nowrap;backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,.6)}
.cld{width:5px;height:5px;border-radius:50%;background:#F5A623;
  display:inline-block;margin-right:5px;vertical-align:middle}

@media(max-width:600px){
  #brand{top:18px;left:18px}.bh{width:38px;height:38px}.bn{font-size:1.3rem}
  #stats{right:12px}.sc{padding:9px 13px}.sn{font-size:1.3rem}
  #replay{top:18px;right:18px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="brand"><div class="bh">HL</div><span class="bn">HexaLog</span></div>

<div id="scene">
  <div id="stitle">Benelux Logistics Network</div>
  <div id="ssub">Premium pallet transport · Benelux &amp; France</div>
</div>

<div id="dots">
  <div class="dot on" id="d0"></div>
  <div class="dot" id="d1"></div>
  <div class="dot" id="d2"></div>
  <div class="dot" id="d3"></div>
  <div class="dot" id="d4"></div>
</div>

<div id="stats">
  <div class="sc"><div class="sn">300+</div><div class="sl">Active Routes</div></div>
  <div class="sc"><div class="sn">24h</div><div class="sl">Express Delivery</div></div>
  <div class="sc"><div class="sn">4</div><div class="sl">Countries</div></div>
  <div class="sc"><div class="sn">98%</div><div class="sl">On-Time Rate</div></div>
</div>

<div id="cta"><a href="index.html?preview=Zwiki2001">Get Instant Quote →</a></div>
<button id="replay" onclick="startSequence()">↺ Replay</button>
<div id="lc"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
/* =====================================================
   RENDERER / SCENE / CAMERA
===================================================== */
var W = window.innerWidth, H = window.innerHeight;
var GR = 1; // globe radius

var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000814, 1);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 200);
camera.position.set(0, 0.5, 3.5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x223366, 2.0));
var sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(5, 3, 5);
scene.add(sun);

/* =====================================================
   STARS
===================================================== */
(function(){
  var n = 3500, pos = new Float32Array(n * 3);
  for(var i = 0; i < n; i++){
    var r = 25 + Math.random() * 60;
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.07, transparent: true, opacity: 0.6, sizeAttenuation: true
  })));
})();

/* =====================================================
   GLOBE
===================================================== */
var globe = new THREE.Group();
scene.add(globe);

// Earth
var earthMat = new THREE.MeshPhongMaterial({
  color: 0x0d2855, emissive: 0x001133, emissiveIntensity: 0.3,
  specular: 0x1a4a8a, shininess: 15
});
var earthMesh = new THREE.Mesh(new THREE.SphereGeometry(GR, 64, 64), earthMat);
globe.add(earthMesh);

// Load texture
new THREE.TextureLoader().load(
  'https://unpkg.com/three-globe/example/img/earth-dark.jpg',
  function(t){ t.anisotropy = renderer.capabilities.getMaxAnisotropy(); earthMat.map = t; earthMat.needsUpdate = true; }
);

// Atmosphere — FrontSide ONLY (no BackSide = no blue dot)
globe.add(new THREE.Mesh(
  new THREE.SphereGeometry(GR * 1.04, 64, 64),
  new THREE.ShaderMaterial({
    vertexShader:[
      'varying float vF;',
      'void main(){',
      '  vec3 wN=normalize((modelMatrix*vec4(normal,0.0)).xyz);',
      '  vec3 wP=(modelMatrix*vec4(position,1.0)).xyz;',
      '  vF=1.0-abs(dot(wN,normalize(cameraPosition-wP)));',
      '  gl_Position=projectionMatrix*viewMatrix*vec4(wP,1.0);',
      '}'
    ].join('\n'),
    fragmentShader:[
      'varying float vF;',
      'void main(){',
      '  float i=pow(vF,3.2);',
      '  gl_FragColor=vec4(0.15,0.48,1.0,i*0.75);',
      '}'
    ].join('\n'),
    side: THREE.FrontSide,
    blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false
  })
));

/* =====================================================
   COORDINATE HELPERS
===================================================== */
// lat/lon → local 3D position on globe (consistent with Three.js SphereGeometry UV)
function ll(lat, lon, r){
  r = (r == null) ? GR : r;
  var phi   = (90 - lat) * Math.PI / 180;
  var theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// Convert globe-local position to world position (accounts for globe rotation)
function localToWorld(localPos){
  var p = localPos.clone();
  globe.localToWorld(p);
  return p;
}

// Camera position in world space to face a lat/lon on the CURRENT rotated globe
var R_frozen = 0; // globe.rotation.y when spinning stopped

function wCam(lat, lon, d){
  // Start from local position, rotate by globe's current frozen rotation
  var local = ll(lat, lon, d);
  var c = Math.cos(R_frozen), s = Math.sin(R_frozen);
  return new THREE.Vector3(
    local.x * c - local.z * s,
    local.y,
    local.x * s + local.z * c
  );
}

/* =====================================================
   CITIES
===================================================== */
var CITIES = [
  { name:'Amsterdam',  lat:52.37, lon:4.89,  col:0xF5A623 },
  { name:'Rotterdam',  lat:51.92, lon:4.48,  col:0xF5A623 },
  { name:'Antwerp',    lat:51.22, lon:4.40,  col:0xF5A623 },
  { name:'Brussels',   lat:50.85, lon:4.35,  col:0x00D4AA },
  { name:'Luxembourg', lat:49.61, lon:6.13,  col:0x00D4AA },
  { name:'Paris',      lat:48.85, lon:2.35,  col:0xFF6B6B },
  { name:'Liège',      lat:50.63, lon:5.57,  col:0xF5A623 },
  { name:'Ghent',      lat:51.05, lon:3.72,  col:0x00D4AA }
];

CITIES.forEach(function(c){ c.pos = ll(c.lat, c.lon, GR); });

var cityGrp = new THREE.Group();
globe.add(cityGrp);
cityGrp.visible = false;

CITIES.forEach(function(city){
  // Core dot
  var dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.008, 10, 10),
    new THREE.MeshBasicMaterial({ color: city.col })
  );
  dot.position.copy(city.pos);
  cityGrp.add(dot);
  city.dot = dot;

  // Two staggered pulse rings
  [0, 1.1].forEach(function(delay){
    var ring = new THREE.Mesh(
      new THREE.RingGeometry(0.010, 0.015, 32),
      new THREE.MeshBasicMaterial({ color: city.col, transparent: true, opacity: 0, side: THREE.DoubleSide })
    );
    ring.position.copy(city.pos);
    ring.lookAt(city.pos.clone().multiplyScalar(3));
    cityGrp.add(ring);
    gsap.to(ring.scale,    { x:5, y:5, z:5, duration:2.4, delay:delay, ease:'power1.out', repeat:-1 });
    gsap.to(ring.material, { opacity:0.85, duration:0.05, delay:delay,
      onComplete:function(){ gsap.to(ring.material,{ opacity:0, duration:2.35, ease:'power1.out', repeat:-1, delay:delay }); }
    });
  });

  // HTML label
  var el = document.createElement('div');
  el.className = 'clabel';
  el.id = 'lbl_' + city.name.replace(/[^a-zA-Z]/g,'');
  el.innerHTML = '<div class="cli"><span class="cld"></span>' + city.name + '</div>';
  document.getElementById('lc').appendChild(el);
  city.lbl = el;
});

/* =====================================================
   ROUTES
===================================================== */
var ROUTES = [
  { from:'Rotterdam',  to:'Antwerp',    col:0xF5A623 },
  { from:'Antwerp',    to:'Brussels',   col:0xF5A623 },
  { from:'Amsterdam',  to:'Rotterdam',  col:0x00D4AA },
  { from:'Brussels',   to:'Luxembourg', col:0x00D4AA },
  { from:'Brussels',   to:'Paris',      col:0xFF6B6B },
  { from:'Antwerp',    to:'Liège',      col:0xF5A623 },
  { from:'Rotterdam',  to:'Brussels',   col:0xFF6B6B },
  { from:'Amsterdam',  to:'Antwerp',    col:0x00D4AA },
  { from:'Luxembourg', to:'Paris',      col:0xFF6B6B },
  { from:'Brussels',   to:'Ghent',      col:0x00D4AA },
  { from:'Ghent',      to:'Antwerp',    col:0xF5A623 },
  { from:'Liège',      to:'Luxembourg', col:0x00D4AA },
  { from:'Amsterdam',  to:'Brussels',   col:0xF5A623 },
  { from:'Paris',      to:'Ghent',      col:0xFF6B6B }
];

var routeGrp = new THREE.Group();
globe.add(routeGrp);
routeGrp.visible = false;

function getCity(name){ return CITIES.find(function(c){ return c.name === name; }); }

ROUTES.forEach(function(r){
  var fc = getCity(r.from), tc = getCity(r.to);
  if(!fc || !tc) return;

  var s = fc.pos.clone(), e = tc.pos.clone();
  var mid = new THREE.Vector3().addVectors(s, e).multiplyScalar(0.5);
  var elev = Math.min(s.distanceTo(e) * 0.55 + 0.06, 0.35);
  mid.normalize().multiplyScalar(GR + elev);

  var pts = new THREE.QuadraticBezierCurve3(s, mid, e).getPoints(120);
  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setDrawRange(0, 0);

  var line = new THREE.Line(geo,
    new THREE.LineBasicMaterial({ color: r.col, transparent: true, opacity: 0.9 })
  );
  line.userData = { total: pts.length, drawn: { n: 0 } };
  routeGrp.add(line);
  r.line = line;
});

/* =====================================================
   SEQUENCE HELPERS
===================================================== */
var spinning = true;

function setDot(n){
  for(var i=0;i<5;i++){
    var el=document.getElementById('d'+i);
    if(el) el.className='dot'+(i===n?' on':'');
  }
}

function setTitle(title, sub, ms){
  ms = ms || 0;
  setTimeout(function(){
    var w = document.getElementById('scene');
    gsap.to(w,{ opacity:0, duration:0.3, onComplete:function(){
      document.getElementById('stitle').textContent = title;
      document.getElementById('ssub').textContent   = sub;
      gsap.to(w,{ opacity:1, duration:0.5 });
    }});
  }, ms);
}

function hideCities(){
  cityGrp.visible = false;
  CITIES.forEach(function(c){
    if(c.lbl){ c.lbl.style.display='none'; c.lbl.classList.remove('on'); }
  });
}

function hideRoutes(){
  routeGrp.visible = false;
  ROUTES.forEach(function(r){ if(r.line) r.line.geometry.setDrawRange(0,0); });
}

function moveCam(x,y,z,dur,ease){
  gsap.to(camera.position,{ x:x, y:y, z:z, duration:dur||3, ease:ease||'power2.inOut' });
}

/* =====================================================
   MAIN SEQUENCE
===================================================== */
function startSequence(){
  spinning = true;
  R_frozen = 0;
  globe.rotation.set(0, 0, 0);
  hideCities();
  hideRoutes();
  camera.position.set(0, 0.5, 3.5);
  gsap.set('#stats',{ opacity:0 });
  gsap.set('#cta',  { opacity:0 });
  gsap.set('#replay',{opacity:0 });
  setDot(0);

  /* ── Scene 0 (0–4s): Globe spins, brand fades in ── */
  gsap.to('#brand',  { opacity:1, duration:1.2, delay:0.5 });
  gsap.to('#scene',  { opacity:1, duration:1.0, delay:0.8 });
  gsap.to('#dots',   { opacity:1, duration:0.8, delay:1.0 });

  /* ── Scene 1 (4s): Zoom to Europe ── */
  setTimeout(function(){
    setDot(1);
    setTitle('Covering Europe','Connecting Benelux & France to global supply chains');

    // Freeze globe, record rotation for wCam()
    spinning   = false;
    R_frozen   = globe.rotation.y;

    var ep = wCam(50, 10, 2.2);
    moveCam(ep.x, ep.y, ep.z, 3.2, 'power2.inOut');
  }, 4000);

  /* ── Scene 2 (8s): Zoom to Benelux ── */
  setTimeout(function(){
    setDot(2);
    setTitle('Benelux & France','Netherlands · Belgium · Luxembourg · France');

    var bp = wCam(51.2, 4.5, 1.5);
    moveCam(bp.x, bp.y, bp.z, 3.5, 'power3.inOut');
  }, 8000);

  /* ── Scene 3 (13s): Cities appear ── */
  setTimeout(function(){
    setDot(3);
    setTitle('Key Logistics Hubs','Major pickup & delivery points across the region');
    cityGrp.visible = true;

    var cp = wCam(51.2, 4.5, 1.28);
    moveCam(cp.x, cp.y, cp.z, 2.5, 'power2.inOut');

    // Pop cities in one by one
    CITIES.forEach(function(city, i){
      setTimeout(function(){
        city.dot.scale.set(0.1, 0.1, 0.1);
        gsap.to(city.dot.scale, { x:1, y:1, z:1, duration:0.5, ease:'back.out(2)' });
        city.lbl.style.display = 'block';
        setTimeout(function(){ city.lbl.classList.add('on'); }, 200);
      }, i * 330);
    });
  }, 13000);

  /* ── Scene 4 (18s): Routes draw ── */
  setTimeout(function(){
    setDot(4);
    setTitle('Live Transport Network','300+ active shipment routes, real-time tracking');
    routeGrp.visible = true;

    ROUTES.forEach(function(r, i){
      if(!r.line) return;
      var d = r.line.userData;
      gsap.to(d.drawn,{
        n: d.total, duration:1.8, delay: i * 0.16,
        ease:'power1.inOut',
        onUpdate:function(){ r.line.geometry.setDrawRange(0, Math.round(d.drawn.n)); }
      });
    });

    // Pulse routes after drawn
    setTimeout(function(){
      ROUTES.forEach(function(r){
        if(r.line) gsap.to(r.line.material,{ opacity:0.35, duration:1.8, yoyo:true, repeat:-1, ease:'sine.inOut' });
      });
    }, ROUTES.length * 160 + 2000);

    gsap.to('#stats',{ opacity:1, duration:0.8, delay:1.5 });
  }, 18000);

  /* ── Scene 5 (27s): CTA ── */
  setTimeout(function(){
    setTitle('Start Shipping Today','Best rates in Benelux — instant online quote');
    gsap.to('#cta',   { opacity:1, duration:1.0, ease:'power2.out' });
    gsap.to('#replay',{ opacity:1, duration:0.8, delay:0.5 });

    var fp = wCam(51.0, 4.5, 1.38);
    moveCam(fp.x, fp.y, fp.z, 3, 'power1.inOut');
  }, 27000);
}

/* =====================================================
   LABEL UPDATER
===================================================== */
var _v3 = new THREE.Vector3();
function updateLabels(){
  CITIES.forEach(function(city){
    if(!city.lbl || city.lbl.style.display==='none') return;

    // World position of this city (globe rotation applied automatically)
    _v3.copy(city.pos);
    globe.localToWorld(_v3);

    // Is city facing camera?
    var toCam = new THREE.Vector3().subVectors(camera.position, _v3).normalize();
    var outward = _v3.clone().normalize();
    var dot = toCam.dot(outward);

    if(dot < 0.05){ city.lbl.style.opacity='0'; return; }

    var proj = _v3.clone().project(camera);
    var x = ( proj.x * 0.5 + 0.5) * W;
    var y = (-proj.y * 0.5 + 0.5) * H;
    city.lbl.style.left = x + 'px';
    city.lbl.style.top  = y + 'px';
    city.lbl.style.opacity = city.lbl.classList.contains('on')
      ? String(Math.min(1, (dot - 0.05) * 5)) : '0';
  });
}

/* =====================================================
   RENDER LOOP
===================================================== */
var clock = 0;
function animate(){
  requestAnimationFrame(animate);
  clock += 0.012;

  // Scene 0 spin — rotates globe around Y axis
  // The spin reveals the globe from Americas through Atlantic to Europe
  if(spinning) globe.rotation.y += 0.004;

  // Organic micro-wobble
  globe.rotation.x = Math.sin(clock * 0.2) * 0.010;

  camera.lookAt(0, 0, 0);
  updateLabels();
  renderer.render(scene, camera);
}

/* =====================================================
   RESIZE
===================================================== */
window.addEventListener('resize', function(){
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* =====================================================
   START
===================================================== */
animate();
startSequence();
</script>
</body>
</html>
